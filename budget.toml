# Leap-Forth ROM budgets and the budget ledger (after 2068-Leap-C's budget.toml; CONTRIBUTING.md).
#
# tools/budget.py measures every component from the production listings: a component is a list of source files (each
# byte belongs to the file that emitted it) and/or [start_label, end_label) ranges ("$end": the end of the code).
# `make budget` prints the table; `make check` fails when a component is over its budget (base budget + the ledger's
# changes), a byte belongs to no component, or an image's free space (after its last non-pad byte) is below its
# reserve floor.
#
# When a component would exceed its budget (Leap-C project_plan.md 1.2): shrink it; move cold code to the EXROM;
# reallocate from another component or from the reserve, with a ledger entry and its measured reason; ask the owner
# if the reserve would fall below its floor. The base budgets are the sizes measured at Simplify (2026-10-30). The
# reserve floors are the owner's targets (decision 1, 2026-10-28): HOME 200 B, EXROM 150 B.

[home]
image = "forth_boot_rom0.bin"
listing = "forth_boot.lst"
symbols = "forth_boot.sym"
base = 0x0000
reserve_floor = 200

[[home.component]]
id = "boot"
title = "Page zero, cold start, the dictionary's assembly glue"
budget = 772
files = ["forth_boot.asm", "forth_version.inc", "rst_vectors.inc", "hardware.inc", "forth_layout.inc", "keys.inc", "graphics_exrom_abi.inc"]

[[home.component]]
id = "kernel"
title = "Hardware layer: screen and font, keyboard and interrupt, memory, 16-bit math, EXROM paging"
budget = 2643
files = ["graphics.asm", "font.asm", "io.asm", "interrupt.asm", "memory.asm", "math.asm", "bank.asm"]

[[home.component]]
id = "tape"
title = "Tape: block send and receive (Leap-C's clean-room code), headers, the LIB and TEXT words"
budget = 1024
files = ["storage.asm", "tapeblock.asm", "tapeword.asm", "loadtext.asm"]

[[home.component]]
id = "interp"
title = "Interpreter and compiler: dictionary, control structures, defining words, errors, CATCH and THROW"
budget = 2291
files = ["interp.asm", "dict.asm", "control.asm", "loop.asm", "loopext.asm", "doloop.asm", "create.asm", "variable.asm", "does.asm", "immediate.asm", "tick.asm", "comment.asm", "execute.asm", "forget.asm", "dictspace.asm", "abortquit.asm", "throwcatch.asm", "vlist.asm", "free.asm"]

[[home.component]]
id = "integer"
title = "Integer words: stack, arithmetic, logic, comparison, memory, arrays, ports"
budget = 828
files = ["stackops.asm", "arith.asm", "logic.asm", "compare.asm", "bytemem.asm", "mathfn.asm", "array.asm", "portio.asm"]

[[home.component]]
id = "float"
title = "Floats: the 5-byte core (Leap-C's fpcore), parsing, printing, conversion, functions, the float stack"
budget = 3015
files = ["fpcore.asm", "fpparse.asm", "fpprint.asm", "fpconv.asm", "fpmath.asm", "fpstack.asm"]

[[home.component]]
id = "text"
title = "Strings and output: the string words, EMIT . TYPE .\" CR SPACE, the printer"
budget = 1516
files = ["string.asm", "stringext.asm", "print.asm", "dotquote.asm", "outwords.asm", "printer.asm"]

[[home.component]]
id = "graphics"
title = "Graphics words: PLOT LINE CLS BORDER, colours, HIRES, UDG, ULAplus, the EXROM words' HOME stubs"
budget = 691
files = ["ts2068.asm", "moregfx.asm", "color.asm", "hires.asm", "udg.asm", "ulaplus.asm", "rectfill.asm", "shapes.asm", "polygon.asm", "sprite.asm"]

[[home.component]]
id = "sound"
title = "Sound: BEEP on the AY, SOUND and the AY words"
budget = 338
files = ["beep.asm", "sound.asm", "soundext.asm"]

[[home.component]]
id = "console"
title = "Console and editor: the line editor, the line store, EDIT's HOME side, KEY, ACCEPT, INPUT, STICK"
budget = 1513
files = ["editor.asm", "recall.asm", "edit.asm", "input.asm", "key.asm", "stick.asm"]

[exrom]
image = "graphics_exrom.bin"
listing = "graphics_exrom.lst"
symbols = "graphics_exrom.sym"
base = 0xA000
reserve_floor = 150

[[exrom.component]]
id = "table"
title = "The service table and its unimplemented-slot stub"
budget = 51
ranges = [["GRAPHICS_EXROM_TABLE", "RECT_FILL_IMPL"]]

[[exrom.component]]
id = "rect"
title = "RECT"
budget = 356
ranges = [["RECT_FILL_IMPL", "POLY_DRAW_IMPL"]]

[[exrom.component]]
id = "polygon"
title = "POLYGON and POLYGON-FILL"
budget = 763
ranges = [["POLY_DRAW_IMPL", "SPRITE_TRANSFER_IMPL"], ["POLY_FILL_IMPL", "STORE_NEXT"]]

[[exrom.component]]
id = "sprites"
title = "SPRITE-DEFINE, SPRITE-SHOW, SPRITE-HIDE"
budget = 364
ranges = [["SPRITE_TRANSFER_IMPL", "POLY_FILL_IMPL"]]

[[exrom.component]]
id = "view"
title = "The full-screen editor (EDIT's view) and its line-store routines"
budget = 2435
ranges = [["STORE_NEXT", "CIRCLE_IMPL"]]

[[exrom.component]]
id = "circle"
title = "CIRCLE"
budget = 234
ranges = [["CIRCLE_IMPL", "FILL_IMPL"], ["CIRCLE_MASK_TABLE", "$end"]]

[[exrom.component]]
id = "fill"
title = "FILL"
budget = 693
ranges = [["FILL_IMPL", "CIRCLE_MASK_TABLE"]]

# The ledger: one entry per reallocation, newest last.
#   [[ledger]]
#   image = "home"          # or "exrom"
#   component = "float"     # a component id, or "reserve_floor"
#   delta = 40              # bytes added to (or, negative, taken from) the budget
#   reason = "what and why, with the measurement"

[[ledger]]
image = "home"
component = "sound"
delta = 2
reason = "SOUND ignores a register number of 256 and up (it wrote register n AND 255): +3 B for the high-byte test, -1 B for a tail jump; from the reserve (1,753 B free)"

[[ledger]]
image = "home"
component = "text"
delta = 4
reason = "LEFT and RIGHT keep the whole string for a count of 256 and up (they used its low byte: 256 LEFT gave an empty string): +6 B; 2 B shrunk in the same component (TYPE and STRING's name copy each had a spare load); from the reserve"

[[ledger]]
image = "home"
component = "interp"
delta = 2
reason = "WORD keeps 31 characters and skips the rest of a longer token (it kept 32, which a header's 5-bit length field stored as 0, so the word could not be found, and left the rest as the next token); from the reserve"

[[ledger]]
image = "home"
component = "console"
delta = 14
reason = "LIST-DEFS ends a definition at the word ; only (it ended at any ; byte, so : CC .\" A;B\" ; was cut short): whitespace tested on both sides; from the reserve"

# Space (2026-10-31): the shrink pass's bytes return to the HOME reserve, so a budget is again the component's size.
[[ledger]]
image = "home"
component = "boot"
delta = -152
reason = "Space: kernel/memory/memory.asm and kernel/interrupt/interrupt.asm assemble in page zero's two gaps (before the NMI vector and before $0100), which were fill counted here (-156); INT_GET_FRAMES's 4 B are fill again (+4); returned to the reserve"

[[ledger]]
image = "home"
component = "kernel"
delta = -5
reason = "Space: INT_GET_FRAMES removed (4 B, nothing called it), one jump relaxed (1 B); returned to the reserve"

[[ledger]]
image = "home"
component = "interp"
delta = -44
reason = "Space: FIND keeps its state in registers (-30 B, and 82 T per header instead of about 180), tail jumps and relaxed jumps (-14 B); returned to the reserve"

[[ledger]]
image = "home"
component = "integer"
delta = -8
reason = "Space: NEGATE calls MATH_NEGATE16 (-4 B), tail jumps (-4 B); returned to the reserve"

[[ledger]]
image = "home"
component = "float"
delta = -2
reason = "Space: two relaxed jumps; returned to the reserve"

[[ledger]]
image = "home"
component = "text"
delta = -85
reason = "Space: SEARCH, UPPER and LOWER rebuilt with 16-bit lengths (-72 B: UPPER and LOWER share one loop, SEARCH keeps its state in registers), STR and . call MATH_NEGATE16 (-8 B), tail and relaxed jumps (-5 B); returned to the reserve"

[[ledger]]
image = "home"
component = "graphics"
delta = -13
reason = "Space: tail jumps and relaxed jumps; returned to the reserve"

[[ledger]]
image = "home"
component = "sound"
delta = -10
reason = "Space: tail jumps (AY_WRITE, SOUND_WRITE) and relaxed jumps; returned to the reserve"

[[ledger]]
image = "home"
component = "console"
delta = -2
reason = "Space: a tail jump and a relaxed jump; returned to the reserve"

# Words and keys (2026-10-31): bytes the step freed return to the HOME reserve; its additions come from it.
[[ledger]]
image = "home"
component = "boot"
delta = 14
reason = "Words and keys: the message of THROW -16 (MISSING NAME), which : CREATE VARIABLE CONSTANT ARRAY STRING FVARIABLE FCONSTANT ' CHAR FORGET give for a missing name (each made a nameless word); from the reserve"

[[ledger]]
image = "home"
component = "kernel"
delta = -45
reason = "Words and keys: the font in ASCII order with 9 more glyphs (+72), the glyph lookup without the range chain and the punctuation table and scan, GFX_CHAR_SETUP merged into GFX_PUTCHAR, the unrolled scanline copy, GFX_PUTCHAR_ATTR (-99 together), IO_DECODE_KEY's one table lookup (-18); returned to the reserve"

[[ledger]]
image = "home"
component = "interp"
delta = 61
reason = "Words and keys: ['] CHAR [CHAR] LITERAL [ ] (88 B) and \\ ( (47 B); WORD_SKIP and WORD_NAME, and one header builder (HEADER_BUILD, HEADER_END, HEADER_LINK) for : CREATE VARIABLE CONSTANT FVARIABLE FCONSTANT, which had their own copies (-74 B net); from the reserve"

[[ledger]]
image = "home"
component = "integer"
delta = -89
reason = "Words and keys: ARRAY is VARIABLE_N with 2n data bytes (it repeated the header and data code); returned to the reserve"

[[ledger]]
image = "home"
component = "float"
delta = 1
reason = "Words and keys: FVARIABLE passes its data size to VARIABLE_N in BC (ld bc,5 is 1 B more than ld a,5); from the reserve"

[[ledger]]
image = "home"
component = "text"
delta = -113
reason = "Words and keys: EMIT draws through GFX_PUTCHAR_ATTR (-31), STRING is VARIABLE_N with n + 1 data bytes (-82); returned to the reserve"

[[ledger]]
image = "home"
component = "console"
delta = -3
reason = "Words and keys: the console's cells draw through GFX_PUTCHAR_ATTR (-5); SCAN_DEFS (LIST-DEFS) reads the store word by word and skips the comments (+2); returned to the reserve"

[[ledger]]
image = "exrom"
component = "view"
delta = 28
reason = "Words and keys: EDIT name skips the comments when it looks for the line with : name (VIEW_MATCH: \\ ends a line's words, ( runs past the next ) ), so a commented-out definition is not opened; from the reserve (3,296 B free)"

[[ledger]]
image = "exrom"
component = "fill"
delta = -4
reason = "Words and keys: the ALIGN 8 before CIRCLE_MASK_TABLE (counted in FILL's range) pads 4 B less after view's +28; returned to the reserve"
